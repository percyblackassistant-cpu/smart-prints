<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Prints — model viewer</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background:#0e1116; color:#e6e6e6; max-width: 980px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 1.6rem; margin-bottom: 4px; }
  .sub { color:#9aa4b2; margin-bottom: 16px; }
  a { color:#58a6ff; }
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .toolbar button {
    background:#1b2129; color:#c9d1d9; border:1px solid #2c3440; border-radius:8px;
    padding:6px 14px; font-size:.85rem; cursor:pointer; transition: all .15s;
  }
  .toolbar button:hover { background:#242c37; border-color:#3d4653; color:#fff; }
  .toolbar button.active { background:#1f6feb22; border-color:#1f6feb; color:#79b8ff; }
  .toolbar .sep { width:1px; background:#2c3440; margin: 2px 4px; }
  #viewer { width:100%; height: 60vh; min-height: 380px; background:linear-gradient(180deg,#1a2027 0%,#12161c 100%); border-radius:12px; border:1px solid #232a33; cursor: grab; touch-action: none; position:relative; }
  #viewer:active { cursor: grabbing; }
  #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#8b949e; font-size:.9rem; background:#12161c; border-radius:12px; z-index:5; transition: opacity .4s; pointer-events:none; }
  .hint { color:#8b949e; font-size:.85rem; margin: 8px 0 24px; }
  .hint b { color:#c9d1d9; }
  .grid { display:grid; gap:16px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  figure { margin:0; background:#161b22; border:1px solid #232a33; border-radius:12px; overflow:hidden; }
  figure img { width:100%; display:block; }
  figcaption { padding:10px 14px; font-size:.9rem; color:#9aa4b2; }
  .specs { background:#161b22; border:1px solid #232a33; border-radius:12px; padding:16px 20px; margin: 24px 0; }
  .specs td { padding: 4px 14px 4px 0; color:#c9d1d9; }
  .specs td:first-child { color:#8b949e; white-space:nowrap; }
  .btn { display:inline-block; background:#238636; color:#fff; padding:10px 18px; border-radius:8px; text-decoration:none; font-weight:600; }
  .btn:hover { background:#2ea043; }
</style>
</head>
<body>
<h1>🔩 Smart Prints — model viewer</h1>
<div class="sub">Bins built with <a href="https://github.com/ostat/gridfinity_extended_openscad">ostat/gridfinity_extended_openscad</a> · rendered with OpenSCAD nightly</div>

<div class="toolbar">
  <button data-model="bin34" class="active m">Bin 3×4 · 42 mm</button>
  <button data-model="bin52" class="m">Bin 5×2 · 60 mm</button>
  <button data-model="doorpanel" class="m">Door HSW panel</button>
  <button data-model="hswclip" class="m">HSW clip</button>
  <button data-model="hswcliphex" class="m">Clip + hex base</button>
  <button data-model="hswcliprect" class="m">Clip + rect base</button>
  <button data-model="hswclipconn" class="m">Wall joiner</button>
  <button data-model="doorhooks" class="m">Door hooks</button>
  <div class="sep"></div>
  <button data-preset="iso" class="active p">Iso</button>
  <button data-preset="front" class="p">Front</button>
  <button data-preset="side" class="p">Side</button>
  <button data-preset="top" class="p">Top</button>
  <button data-preset="inside" class="p">Inside</button>
  <div class="sep"></div>
  <button data-color="0x4f7cac" class="active c">Steel blue</button>
  <button data-color="0xe2a94f" class="c">Orange</button>
  <button data-color="0x2f9e44" class="c">Green</button>
  <button data-color="0xd8d8d8" class="c">Silver</button>
  <div class="sep"></div>
  <button id="wireBtn">Wireframe</button>
  <button id="shotBtn">📷 Snapshot</button>
</div>
<div id="viewer"><div id="loading">Loading STL…</div></div>
<div class="hint">🖱️ <b>Drag</b> to spin · <b>wheel / pinch</b> to zoom · <b>right-drag</b> to pan · auto-rotates when idle</div>

<div class="grid">
  <figure>
    <img id="sectionImg" src="wall_section_7mm.png" alt="wall cross-section">
    <figcaption>Wall cross-section (per model)</figcaption>
  </figure>
  <figure id="stillFig">
    <img id="stillImg" src="gridfinity_ext_3x4_7mm_3D.png" alt="3D shaded render">
    <figcaption>Static shaded render</figcaption>
  </figure>
</div>

<div class="specs"><table id="specTable"></table></div>
<a class="btn" id="dlBtn" href="#" download>⬇ Download STL</a>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

const MODELS = {
  bin34: {
    stl: "gridfinity_ext_3x4.stl",
    section: "wall_section_7mm.png",
    still: "gridfinity_ext_3x4_7mm_3D.png",
    dl: "gridfinity_ext_3x4.stl",
    specs: [
      ["Footprint", "126 × 168 mm (3×4 cells @ 42 mm pitch)"],
      ["Height", "42 mm (6 gridfinity units)"],
      ["Wall pattern", "hexgrid, 7 mm across flats"],
      ["Volume", "118.8 cm³ · watertight"],
      ["Print", "flat, no supports, PLA/PETG"]
    ]
  },
  bin52: {
    stl: "gridfinity_ext_5x2_60mm.stl",
    section: "wall_section_5x2_60.png",
    still: "",
    dl: "gridfinity_ext_5x2_60mm.stl",
    specs: [
      ["Footprint", "209.5 × 83.5 mm (5×2 cells)"],
      ["Height", "63 mm (9 units)"],
      ["Wall pattern", "hexgrid, 7 mm across flats"],
      ["Volume", "107 cm³ · watertight"],
      ["Print", "flat, no supports; wall hexes bridge"]
    ]
  },
  doorpanel: {
    stl: "hsw_door_mount_v1.stl",
    section: "hsw_door_mount_v1.png",
    still: "",
    dl: "hsw_door_mount_v1.stl",
    specs: [
      ["Purpose", "HSW wall panel that hangs over a 19 mm door — no screws"],
      ["Clamp", "top arm 8 mm over door edge; back arm 70 mm inside face"],
      ["Facing", "3 hex plugs (AF 7.8) for one standard HSW tile, tilted 8° up"],
      ["Plate", "200 mm wide, hangs 120 mm below door top"],
      ["Volume", "127.6 cm³ · watertight"],
      ["Print", "flat on its back, no supports, PETG recommended"]
    ]
  },
  hswclip: {
    stl: "hsw_clip.stl",
    section: "hsw_clips_preview.png",
    still: "",
    dl: "hsw_clip.stl",
    specs: [
      ["Purpose", "Spring clip insert for HSW — one-way directional snap, smooth insertion"],
      ["Source", "geru/3d-scad-hsw-clip (OpenSCAD library, BOSL2)"],
      ["Volume", "0.6 cm³ · watertight"],
      ["Print", "flat, no supports"]
    ]
  },
  hswcliphex: {
    stl: "hsw_clip_hexbase.stl",
    section: "hsw_clips_preview.png",
    still: "",
    dl: "hsw_clip_hexbase.stl",
    specs: [
      ["Purpose", "Spring clip with hex base — mount anything with a hex footprint to HSW"],
      ["Source", "geru/3d-scad-hsw-clip"],
      ["Volume", "1.9 cm³ · watertight"],
      ["Print", "flat, no supports"]
    ]
  },
  hswcliprect: {
    stl: "hsw_clip_rectbase.stl",
    section: "hsw_clips_preview.png",
    still: "",
    dl: "hsw_clip_rectbase.stl",
    specs: [
      ["Purpose", "Spring clip with rectangular base — for boxes and rails"],
      ["Source", "geru/3d-scad-hsw-clip"],
      ["Print", "flat, no supports"]
    ]
  },
  hswclipconn: {
    stl: "hsw_clipconnector.stl",
    section: "hsw_clips_preview.png",
    still: "",
    dl: "hsw_clipconnector.stl",
    specs: [
      ["Purpose", "Joins two neighboring HSW wall pieces edge-to-edge"],
      ["Source", "geru/3d-scad-hsw-clip"],
      ["Volume", "2.6 cm³ · watertight"],
      ["Print", "flat, no supports"]
    ]
  },
  doorhooks: {
    stl: "door_hooks_v1.stl",
    section: "door_hooks_v1_front.png",
    still: "",
    dl: "door_hooks_v1.stl",
    specs: [
      ["Purpose", "Over-door hook rail for the same 19 mm door — robes, bags, coats"],
      ["Hooks", "2 large J-hooks (42 mm out, 55 mm drop) at ±75 mm, 1 small centre hook"],
      ["Clamp", "same no-screw over-top clamp as the HSW panel"],
      ["Plate", "200 mm wide, hangs 120 mm down"],
      ["Volume", "305 cm³ · watertight single body"],
      ["Print", "flat on its back, no supports, PETG recommended"]
    ]
  }
};

const box = document.getElementById('viewer');
const loading = document.getElementById('loading');
const scene = new THREE.Scene();
scene.background = null;
const camera = new THREE.PerspectiveCamera(45, box.clientWidth / box.clientHeight, 0.1, 4000);
const renderer = new THREE.WebGLRenderer({antialias: true, alpha: true, preserveDrawingBuffer: true});
renderer.setSize(box.clientWidth, box.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
box.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x252b33, 1.0));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(140, 260, 160); scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, 0.55); fill.position.set(-180, 90, -140); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffe9c4, 0.45); rim.position.set(60, 40, -220); scene.add(rim);

const grid = new THREE.GridHelper(500, 25, 0x2a3140, 0x1b212a);
grid.position.y = -0.05; scene.add(grid);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.autoRotate = true; controls.autoRotateSpeed = 1.4;
controls.minDistance = 40; controls.maxDistance = 1600;

let idle;
const pauseAuto = () => { controls.autoRotate = false; clearTimeout(idle); };
const resumeSoon = () => { clearTimeout(idle); idle = setTimeout(() => controls.autoRotate = true, 4000); };
['start','wheel'].forEach(ev => controls.addEventListener(ev, pauseAuto));
controls.addEventListener('end', resumeSoon);
renderer.domElement.addEventListener('wheel', resumeSoon, {passive:true});

let mesh = null;
const cameraState = { modelH: 42, modelR: 100 };

function flyTo(pos, target) {
  camera.position.copy(pos);
  controls.target.copy(target);
  controls.update();
  resumeSoon();
}
const fitDist = (tweak = 0) =>
  cameraState.modelR / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.15 + tweak;

const PRESETS = {
  iso:   () => flyTo(new THREE.Vector3(0.62, 0.5, 0.78).multiplyScalar(fitDist()), new THREE.Vector3(0, cameraState.modelH * 0.45, 0)),
  front: () => flyTo(new THREE.Vector3(0, 0.25, 1).multiplyScalar(fitDist(60)), new THREE.Vector3(0, cameraState.modelH * 0.45, 0)),
  side:  () => flyTo(new THREE.Vector3(1, 0.25, 0).multiplyScalar(fitDist(60)), new THREE.Vector3(0, cameraState.modelH * 0.45, 0)),
  top:   () => flyTo(new THREE.Vector3(0.001, 1, 0.001).multiplyScalar(fitDist()), new THREE.Vector3(0, cameraState.modelH * 0.4, 0)),
  inside:() => flyTo(new THREE.Vector3(0.001, 1, 0.001).multiplyScalar(cameraState.modelH * 1.1), new THREE.Vector3(0, 2, 0)),
};

const loader = new STLLoader();
let loadReq = 0;
function loadSTL(url){
  const req = ++loadReq;
  loading.style.opacity = '1';
  loader.load(url, geom => {
    if (req !== loadReq) return;
    if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); }
    const color = mesh ? mesh.material.color.getHex() : 0x4f7cac;
    const wire = mesh ? mesh.material.wireframe : false;
    geom.computeVertexNormals();
    geom.center();
    geom.computeBoundingSphere();
    const size = geom.boundingBox.getSize(new THREE.Vector3());
    mesh = new THREE.Mesh(geom, new THREE.MeshStandardMaterial({color, metalness:0.12, roughness:0.5, wireframe: wire}));
    mesh.position.y = size.y / 2;
    scene.add(mesh);
    cameraState.modelH = size.y;
    cameraState.modelR = geom.boundingSphere.radius;
    PRESETS.iso();
    loading.style.opacity = '0';
  });
}

function switchModel(id){
  const m = MODELS[id];
  if (!m) return;
  document.querySelectorAll('button.m').forEach(b => b.classList.toggle('active', b.dataset.model === id));
  document.getElementById('specTable').innerHTML =
    m.specs.map(s => `<tr><td>${s[0]}</td><td>${s[1]}</td></tr>`).join('');
  document.getElementById('dlBtn').href = m.dl;
  document.getElementById('sectionImg').src = m.section;
  const fig = document.getElementById('stillFig');
  if (m.still) { document.getElementById('stillImg').src = m.still; fig.style.display = ''; }
  else fig.style.display = 'none';
  loadSTL(m.stl);
}
document.querySelectorAll('button.m').forEach(b => b.addEventListener('click', () => switchModel(b.dataset.model)));
document.querySelectorAll('button.p').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('button.p').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  PRESETS[b.dataset.preset]();
}));
document.querySelectorAll('button.c').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('button.c').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  if (mesh) mesh.material.color.set(Number(b.dataset.color));
}));
document.getElementById('wireBtn').addEventListener('click', e => {
  if (!mesh) return;
  mesh.material.wireframe = !mesh.material.wireframe;
  e.target.classList.toggle('active', mesh.material.wireframe);
});
document.getElementById('shotBtn').addEventListener('click', () => {
  renderer.render(scene, camera);
  const a = document.createElement('a');
  a.href = renderer.domElement.toDataURL('image/png');
  a.download = 'smart-prints-snapshot.png';
  a.click();
});

switchModel('bin34');

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = box.clientWidth / box.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(box.clientWidth, box.clientHeight);
});
</script>
</body>
</html>
